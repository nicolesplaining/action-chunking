[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "action-chunking"
version = "0.1.0"
description = "Causal interventions for action commitment in flow-matching VLAs"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<2",
  "pyyaml>=6",
  "torch==2.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/action_chunking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "UP"]
